      ${["","50","60","70","75","80","85","90"].map(v=>`<option value="${v}" ${String(r?r.asist_min:"80")===v?"selected":""}>${v?v+"%":"No exige"}</option>`).join("")}
    </select></div>

    <div class="fld"><label>Horario semanal — un bloque por módulo</label><div id="r_hor"></div>
      <button class="btn mini" style="margin-top:6px" onclick="window.__hor.push({d:1,i:'10:00',f:'11:10'});pintarHorario()">＋ otro bloque</button>
      <div class="hint">Si un día tienes dos módulos seguidos, agrégalos por separado: así el porcentaje de asistencia queda exacto.</div></div>
    <div class="frow">
      <div class="fld"><label>Primera clase</label><input id="r_desde" type="date" class="inp" value="${desde}"></div>
      <div class="fld"><label>Última clase</label><input id="r_hasta" type="date" class="inp" value="${hasta}"></div>
    </div>
    ${r? `<div class="hint">Al guardar se recalculan las clases con este horario. Se conservan tus faltas marcadas, las clases que agregaste a mano, tus notas y evaluaciones.</div>`
       : `<div class="fld"><label>Ponderaciones (deben sumar 100%)</label><div id="r_comps"></div>
          <button class="btn mini" style="margin-top:6px" onclick="window.__comps.push({nombre:'',peso:0});pintarComps()">＋ otra ponderación</button>
          <div class="hint" id="r_suma"></div></div>`}
    <button class="btn primary" style="margin-top:14px" onclick="guardarRamo()">${r?"Guardar cambios":"Crear ramo"}</button>
    ${r? `<button class="btn danger" style="margin-top:10px" onclick='mBorrarRamo("${r.id}")'>Eliminar ramo</button>`:""}`);
  pintarHorario(); if(!r) pintarComps();
}
function elegirColor(i,btn){ window.__color=PALETA[i][0]; document.querySelectorAll("#r_colores button").forEach(b=>b.classList.remove("on")); btn.classList.add("on"); }
function pintarHorario(){
  const DS=[["1","lunes"],["2","martes"],["3","miércoles"],["4","jueves"],["5","viernes"],["6","sábado"]];
  $("#r_hor").innerHTML=window.__hor.map((hr,i)=>`<div class="frow" style="margin-bottom:6px">
    <select class="inp" onchange="window.__hor[${i}].d=+this.value">${DS.map(([v,t])=>`<option value="${v}" ${+v===+hr.d?"selected":""}>${t}</option>`).join("")}</select>
    <input type="time" class="inp" value="${hr.i||""}" onchange="window.__hor[${i}].i=this.value">
    <input type="time" class="inp" value="${hr.f||""}" onchange="window.__hor[${i}].f=this.value">
    ${window.__hor.length>1?`<button class="iconbtn" onclick="window.__hor.splice(${i},1);pintarHorario()">✕</button>`:""}
  </div>`).join("");
}
function pintarComps(){
  const cont=$("#r_comps"); if(!cont) return;
  cont.innerHTML=window.__comps.map((c,i)=>`<div class="frow" style="margin-bottom:6px">
    <input class="inp" placeholder="nombre" value="${h(c.nombre)}" onchange="window.__comps[${i}].nombre=this.value">
    <input class="inp" type="number" style="max-width:86px" placeholder="%" value="${c.peso||""}" onchange="window.__comps[${i}].peso=+this.value;pintarSuma()">
    <button class="iconbtn" onclick="window.__comps.splice(${i},1);pintarComps()">✕</button>
  </div>`).join("");
  pintarSuma();
}
function pintarSuma(){
  const s=window.__comps.reduce((a,c)=>a+(+c.peso||0),0);
  const el=$("#r_suma"); if(el) el.innerHTML= s===100? "✓ suman 100%" : `⚠︎ van sumando <b>${s}%</b> (deben ser 100)`;
}

function guardarRamo(){
  /* IMPORTANTE: leer TODOS los campos ANTES de cerrar el modal */
  const editId = window.__editando;
  const nom=$("#r_nom").value.trim();
  const emo=$("#r_emo").value.trim()||"📘";
  const sig=$("#r_sig").value.trim();
  const prof=$("#r_prof").value.trim();
  const min=$("#r_min").value;
  const desde=$("#r_desde").value, hasta=$("#r_hasta").value;
  const color=window.__color;
  const hor=window.__hor.filter(x=>x.d&&x.i).map(x=>({d:+x.d,i:x.i,f:x.f||""}))
                        .sort((a,b)=>(a.d-b.d)||a.i.localeCompare(b.i));
  let comps=(window.__comps||[]).filter(c=>String(c.nombre).trim());

  if(!nom){ toast("Ponle nombre al ramo"); return; }
  if(!hor.length){ toast("Agrega al menos un bloque de horario"); return; }
  if(!desde||!hasta||hasta<desde){ toast("Revisa las fechas de inicio y fin"); return; }
  if(!editId){
    const suma=comps.reduce((a,c)=>a+(+c.peso||0),0);
    if(comps.length && suma!==100){ toast("Las ponderaciones deben sumar 100% (van "+suma+"%)"); return; }
    if(!comps.length) comps=[{nombre:"Notas",peso:100}];
  }

  const partes=sig.split("-");
  const id = editId || ("ramo-"+Date.now().toString(36));
  const fila={ id, nombre:nom, sigla:partes[0]||"", seccion:partes[1]||"", profesor:prof, emoji:emo,
               color, asist_min:min, horario_txt:horarioTxt(hor), horario_json:JSON.stringify(hor), activo:1 };
  const fechas = editId? regenerarFechas(id,hor,desde,hasta) : generarFechas(id,hor,desde,hasta);
  if(!fechas.length){ toast("Con ese horario y esas fechas no hay ninguna clase"); return; }

  cerrarModal();
  const cambios=[];
  if(editId){
    cambios.push({tabla:"Ramos", rows:[fila]});
    cambios.push({tabla:"Fechas", reemplazarRamo:id, rows:fechas});
  } else {
    fila.orden=(DB.Ramos||[]).length+1; fila.eximicion=""; fila.reglas="";
    cambios.push({tabla:"Ramos", rows:[fila]});
    cambios.push({tabla:"Fechas", rows:fechas});
    cambios.push({tabla:"Componentes", rows:comps.map((c,i)=>({id:id+"-c"+(i+1), ramo:id, nombre:String(c.nombre).trim(),
      peso:+c.peso, detalle:"", es_examen:0, nota_min:"", prom_directo:""}))});
  }
  guardar.apply(null,cambios);
  if(!editId) nav({v:"ramo", id, tab:"asist"});
  toast(editId? "Ramo actualizado · "+fechas.length+" clases" : "Ramo creado con "+fechas.length+" clases");
}

/* ---- eliminar ramo de verdad ---- */
function mBorrarRamo(ramoId){
  const r=ramo(ramoId); if(!r) return;
  const n=fechasRamo(ramoId).length;
  const notas=evalsDe(ramoId).filter(e=>e.nota!==""&&e.nota!=null).length;
  mConfirm(`Se eliminará "${h(r.nombre)}" con sus ${n} clases, sus ponderaciones y ${notas} nota(s) anotada(s).\n\nEsto no se puede deshacer.`,
    ()=>{ guardar({borrarRamo:ramoId}); nav({v:"ramos"}); toast("Ramo eliminado"); }, "Eliminar");
}

/* ================================================================
   PANTALLAS DE ENTRADA + ARRANQUE
   ================================================================ */
function pantallaCarga(){
  $("#gate").innerHTML=`<div class="gate"><div class="box">
    <div class="logo">🎓</div><h2>${h(CONFIG.NOMBRE_APP)}</h2><div class="spin"></div>
    <div class="t3">Cargando tus ramos…</div></div></div>`;
}
function pantallaSetup(msg){
  $("#gate").innerHTML=`<div class="gate"><div class="box" style="max-width:400px">
    <div class="logo">🎓</div><h2>${h(CONFIG.NOMBRE_APP)}</h2>
    <div class="t2" style="margin:6px 0 14px">${msg? h(msg) : "Conecta tu planilla de Google para guardar tus ramos, faltas y notas."}</div>
    <div class="fld" style="text-align:left"><label>URL de tu planilla (termina en /exec)</label>
      <input id="s_url" class="inp" placeholder="https://script.google.com/…/exec" value="${h(store.get("url")||"")}"></div>
    <div class="fld" style="text-align:left"><label>Clave (deja cualquier cosa si tu planilla no la pide)</label>
      <input id="s_clave" class="inp" value="${h(store.get("clave")||"")}"></div>
    <button class="btn primary" onclick="guardarConexion()">Conectar</button>
    <button class="btn" style="margin-top:8px" onclick="entrarDemo()">Ver un ejemplo sin conectar</button>
    <div class="hint" style="text-align:left;margin-top:14px">¿No tienes la planilla todavía? Sigue la guía de instalación: se crea en Google Sheets, se pega el código y se publica como aplicación web.</div>
  </div></div>`;
}
function guardarConexion(){
  const u=$("#s_url").value.trim(), c=$("#s_clave").value.trim();
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){ toast("La URL debe empezar con https://script.google.com y terminar en /exec"); return; }
  store.set("url",u); store.set("clave",c||"-"); store.del("cache"); COLA=[]; store.set("cola",[]);
  DEMO=false; DB=null; cargar();
}
function entrarDemo(){ DEMO=true; datosEjemplo(); RUTA={v:"hoy"}; arrancar(); }
function pantallaClave(msg){
  $("#gate").innerHTML=`<div class="gate"><div class="box">
    <div class="logo">🎓</div><h2>${h(CONFIG.NOMBRE_APP)}</h2>
    <div class="t2" style="margin:6px 0 16px">${msg?h(msg):"Escribe tu clave para entrar"}</div>
    <input id="g_clave" class="inp" type="password" placeholder="clave" style="text-align:center" onkeydown="if(event.key==='Enter')entrarClave()">
    <button class="btn primary" style="margin-top:12px" onclick="entrarClave()">Entrar</button>
    <button class="btn" style="margin-top:8px" onclick="pantallaSetup()">Usar otra planilla</button>
  </div></div>`;
  setTimeout(()=>{ const i=$("#g_clave"); if(i) i.focus(); },100);
}
function entrarClave(){
  const v=$("#g_clave").value.trim();
  if(!v) return;
  store.set("clave", v);
  cargar();
}
function pantallaError(msg){
  $("#gate").innerHTML=`<div class="gate"><div class="box">
    <div class="logo">🎓</div><h2>Ups</h2>
    <div class="t2" style="margin:8px 0 16px;text-align:left;white-space:pre-line">${h(msg)}</div>
    <button class="btn primary" onclick="cargar()">Reintentar</button>
    ${CONFIG.URL_PLANILLA?"":`<button class="btn" style="margin-top:8px" onclick="pantallaSetup()">Cambiar la conexión</button>`}</div></div>`;
}
function arrancar(){
  $("#gate").innerHTML="";
  $("#tabbar").style.display="";
  render();
}

window.addEventListener("online", ()=>sincronizar());
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && DB && !DEMO && !COLA.length) cargar(true); });
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>aplicarTema()); }catch(e){}
aplicarTema();
cargar();
</script>
